name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  GRADLE_USER_HOME: ${{ runner.temp }}/.gradle

jobs:
  build:
    name: Build and release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push version bump
      packages: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install JS dependencies
        run: |
          if [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          else
            npm ci
          fi

      - name: Set up Android SDK
        uses: r0adkll/setup-android@v2
        with:
          api-level: 31
          build-tools: 31.0.0
          ndk: 21.4.7075529

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure gradlew is executable
        run: chmod +x ./android/gradlew

      - name: Bump Android versionCode and versionName
        id: bump_version
        run: |
          set -e
          BUILD_FILE=android/app/build.gradle
          if [ ! -f "$BUILD_FILE" ]; then
            echo "Error: $BUILD_FILE not found"
            exit 1
          fi

          # Extract current versionCode and versionName
          CURRENT_CODE=$(grep -E "versionCode\s+\d+" $BUILD_FILE | head -n1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          CURRENT_NAME=$(grep -E "versionName\s+\"[^"]+\"" $BUILD_FILE | head -n1 | sed -E 's/.*\"([^"]+)\".*/\1/')

          echo "Current versionCode: $CURRENT_CODE"
          echo "Current versionName: $CURRENT_NAME"

          NEW_CODE=$((CURRENT_CODE + 1))
          # Use GitHub run number to form versionName (keeps major.minor from current if possible)
          # If current name has at least two dots (like 1.2.3) preserve major.minor
          if echo "$CURRENT_NAME" | grep -q "^[0-9]+\.[0-9]+\.[0-9]+$"; then
            MAJOR_MINOR=$(echo "$CURRENT_NAME" | awk -F. '{print $1"."$2}')
            NEW_NAME="${MAJOR_MINOR}.${{ github.run_number }}"
          else
            NEW_NAME="1.0.${{ github.run_number }}"
          fi

          echo "New versionCode: $NEW_CODE"
          echo "New versionName: $NEW_NAME"

          # Replace values in build.gradle (supports numeric and string forms)
          # Use perl for robust in-place editing
          perl -0777 -pe "s/(versionCode\s+)\d+/$1${NEW_CODE}/s" -i $BUILD_FILE
          perl -0777 -pe "s/(versionName\s+\")([^\"]+)(\")/$1${NEW_NAME}$3/s" -i $BUILD_FILE

          # Show changed file snippet
          echo "--- updated build.gradle ---"
          sed -n '1,240p' $BUILD_FILE

          echo "VERSION_CODE=${NEW_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${NEW_NAME}" >> $GITHUB_ENV

      - name: Commit and push version bump
        if: steps.bump_version.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle
          git commit -m "chore(android): bump versionCode to $VERSION_CODE, versionName to $VERSION_NAME [skip ci]" || echo "No changes to commit"
          git push origin HEAD:$GITHUB_REF_NAME || echo "Push failed or not required"

      - name: Build Android release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          PATH: ${{ runner.tool_cache }}/android-sdk/platform-tools:$PATH
        run: |
          set -e
          cd android
          ./gradlew clean assembleRelease -Pci

      - name: Upload APK to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release and upload APK
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.VERSION_NAME }}
          name: "Release v${{ env.VERSION_NAME }}"
          files: android/app/build/outputs/apk/release/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Done
        run: echo "Release created for version $VERSION_NAME"
